<rect x="35" y="1250" width="2130" height="292" rx="18" fill="white" stroke="#d6dfea" stroke-width="2"/>
<text x="65" y="1300.22" font-family="Arial, sans-serif" font-size="27" fill="#172b46" font-weight="700" text-anchor="start">WHAT IS SCALED — AND WHAT STILL NEEDS MEASURING</text>
<text x="65" y="1342.78" font-family="Arial, sans-serif" font-size="23" fill="#176cbd" font-weight="700" text-anchor="start">Scaled geometry</text>
<text x="65" y="1378.92" font-family="Arial, sans-serif" font-size="22" fill="#53657a" font-weight="400" text-anchor="start">Body Ø348 mm and wheel base 235 mm use current robot assumptions.</text>
<text x="65" y="1414.92" font-family="Arial, sans-serif" font-size="22" fill="#53657a" font-weight="400" text-anchor="start">Phone outline 143.6 × 70.9 × 7.7 mm uses Apple’s nominal iPhone X size.</text>
<text x="65" y="1450.92" font-family="Arial, sans-serif" font-size="22" fill="#53657a" font-weight="400" text-anchor="start">Lens −200 mm forward and 85 mm high reproduce the screenshot settings.</text>
<text x="65" y="1486.92" font-family="Arial, sans-serif" font-size="22" fill="#53657a" font-weight="400" text-anchor="start">No app, mount calibration or robot-control settings were changed.</text>
<text x="1215" y="1342.78" font-family="Arial, sans-serif" font-size="23" fill="#16735d" font-weight="700" text-anchor="start">Illustrative geometry / next measurement</text>
<text x="1215" y="1378.92" font-family="Arial, sans-serif" font-size="22" fill="#53657a" font-weight="400" text-anchor="start">Lens lateral distance L, lens-to-phone edges and carton placement</text>
<text x="1215" y="1414.92" font-family="Arial, sans-serif" font-size="22" fill="#53657a" font-weight="400" text-anchor="start">are provisional. Measure L from the centerline to the active lens.</text>
<text x="1215" y="1450.92" font-family="Arial, sans-serif" font-size="22" fill="#53657a" font-weight="400" text-anchor="start">Phone top means the physical notch/camera end, not landscape UI.</text>
